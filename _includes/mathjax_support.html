<!-- MathJax 3: kramdown outputs \( ... \) for inline and \[ ... \] for display math -->
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']], processEscapes: true },
    chtml: { scale: 0.95 }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
